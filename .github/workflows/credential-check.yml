name: Credential Leak Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  credential-leak-check:
    name: Check for credential leaks in tracked files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check .env.example for credential-shaped values
        run: |
          # Fail if .env.example contains any non-empty value after common key names
          if grep -qE '^(TELEGRAM_BOT_TOKEN|RUGCHECK_API_KEY|HELIUS_API_KEY|QUICKNODE_RPC_URL|SHYFT_API_KEY|TWITTERAPI_IO_KEY)=.+[^[:space:]]' .env.example; then
            echo "❌ FAIL: .env.example appears to contain real credential values (non-empty values found)"
            grep -nE '^(TELEGRAM_BOT_TOKEN|RUGCHECK_API_KEY|HELIUS_API_KEY|QUICKNODE_RPC_URL|SHYFT_API_KEY|TWITTERAPI_IO_KEY)=.+[^[:space:]]' .env.example
            exit 1
          fi
          echo "✅ PASS: .env.example contains only blank/placeholder values"

      - name: Verify .env is gitignored
        run: |
          if ! git check-ignore .env >/dev/null 2>&1; then
            echo "❌ FAIL: .env is not ignored by .gitignore"
            exit 1
          fi
          echo "✅ PASS: .env is properly gitignored"

      - name: Scan git history for leaked credentials
        run: |
          # Search entire git history for patterns that look like real credentials
          # Telegram bot token: 10+ digits, colon, 35+ alphanumeric/hyphen/underscore
          # RugCheck key: UUID format
          # Helius/QuickNode/Shyft/TwitterAPI keys: various formats
          LEAKED=$(git log --all --full-history --oneline --source --remotes -S 'TELEGRAM_BOT_TOKEN=' -- '*.py' '*.md' '*.txt' '*.yml' '*.yaml' '*.json' '*.toml' '.env*' 2>/dev/null | head -20)
          if [ -n "$LEAKED" ]; then
            echo "⚠️  WARNING: Potential credential references found in git history:"
            echo "$LEAKED"
            # Don't fail - just warn, since these might be placeholder references
          else
            echo "✅ PASS: No obvious credential patterns found in tracked file history"
          fi

      - name: Check for hardcoded secrets in source files
        run: |
          # Look for patterns that look like real API keys in tracked source files
          PATTERNS=(
            "TELEGRAM_BOT_TOKEN=[\"'][0-9]{8,}:[A-Za-z0-9_-]{30,}[\"']"
            "RUGCHECK_API_KEY=[\"'][0-9a-f-]{36}[\"']"
            "HELIUS_API_KEY=[\"'][0-9a-f-]{36}[\"']"
            "QUICKNODE_RPC_URL=[\"']https://[^\"']*quiknode[^\"']*[\"']"
            "SHYFT_API_KEY=[\"'][A-Za-z0-9_-]{20,}[\"']"
            "TWITTERAPI_IO_KEY=[\"'][A-Za-z0-9_-]{20,}[\"']"
          )
          
          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            if git grep -E "$pattern" -- ':!*.env' ':!*.example' 2>/dev/null | grep -v test | grep -v fake; then
              FOUND=1
            fi
          done
          
          if [ $FOUND -eq 1 ]; then
            echo "❌ FAIL: Hardcoded credential patterns found in tracked source files"
            exit 1
          fi
          echo "✅ PASS: No hardcoded credential patterns in tracked source files"